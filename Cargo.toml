[package]
name = "work-stealing-scheduler"
version = "0.1.0"
edition = "2021"
description = "A from-scratch work-stealing scheduler in Rust: a worker-pool runtime with priorities, cancellation, panic-safe task handles, and a dependency-graph (DAG) task scheduler."
license = "MIT"
repository = "https://github.com/czhao-dev/work-stealing-thread-pool"
readme = "README.md"
keywords = ["work-stealing", "scheduler", "concurrency", "runtime", "thread-pool"]
categories = ["concurrency", "asynchronous"]

[lib]
name = "work_stealing_scheduler"
path = "src/lib.rs"

[dependencies]
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
num_cpus = "1.16"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "scheduler_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
